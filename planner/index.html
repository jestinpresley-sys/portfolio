<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Weekly Planner</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3B5A4C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F5F1E6;
    --paper-card: #FFFDF8;
    --ink: #24241F;
    --ink-soft: #75705F;
    --line: #E1D9C4;
    --pine: #3B5A4C;
    --pine-dim: #E4EAE3;
    --ochre: #B0793A;
    --ochre-dim: #F3E4CE;
    --done: #A9A296;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom:48px;
    padding-top:env(safe-area-inset-top);
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:20px 16px 8px;
  }

  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .nav-btn{
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper-card);
    color:var(--pine);
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    touch-action:manipulation;
  }
  .nav-btn:active{background:var(--pine-dim);}
  .week-label{
    text-align:center;
    flex:1;
  }
  .week-label .range{
    font-family:'Newsreader', serif;
    font-size:22px;
    font-weight:500;
    line-height:1.1;
  }
  .week-label .sub{
    font-size:11px;
    letter-spacing:.03em;
    color:var(--ink-soft);
    margin-top:2px;
    cursor:pointer;
  }

  .quote{
    text-align:center;
    padding:0 20px;
    margin-bottom:18px;
  }
  .quote .quote-text{
    font-family:'Newsreader', serif;
    font-style:italic;
    font-size:15px;
    line-height:1.45;
    color:var(--ink);
  }
  .quote .quote-source{
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .focus{
    background:var(--pine);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:18px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .focus .tag{
    font-family:'Newsreader', serif;
    font-style:italic;
    color:#DCE6DF;
    font-size:14px;
    white-space:nowrap;
  }
  .focus input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:#fff;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:500;
  }
  .focus input::placeholder{color:#B9C9BF;}

  .day{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:16px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .day.today{
    border-color:var(--pine);
    box-shadow:0 0 0 1px var(--pine);
  }
  .day-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px 8px;
  }
  .day-name{
    font-family:'Newsreader', serif;
    font-size:19px;
    font-weight:600;
  }
  .day-date{
    font-size:12px;
    color:var(--ink-soft);
  }
  .today .day-name{color:var(--pine);}
  .today-pill{
    font-size:10px;
    background:var(--ochre-dim);
    color:var(--ochre);
    border-radius:20px;
    padding:2px 8px;
    font-weight:600;
    letter-spacing:.02em;
  }

  .items{
    padding:2px 10px 8px;
  }
  .item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:7px 6px;
    border-radius:8px;
  }
  .item:active{background:var(--pine-dim);}
  .check{
    width:19px;height:19px;
    min-width:19px;
    border-radius:6px;
    border:1.5px solid var(--line);
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    background:#fff;
  }
  .check.on{
    background:var(--pine);
    border-color:var(--pine);
  }
  .check.on svg{display:block;}
  .check svg{display:none;width:12px;height:12px;}
  .item-text{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Work Sans', sans-serif;
    font-size:14.5px;
    color:var(--ink);
    padding-top:1px;
    resize:none;
    line-height:1.35;
  }
  .item.done .item-text{
    color:var(--done);
    text-decoration:line-through;
    text-decoration-color:var(--done);
  }
  .item-del{
    color:var(--line);
    font-size:16px;
    cursor:pointer;
    padding:2px 4px;
    line-height:1;
  }
  .item:hover .item-del{color:var(--ink-soft);}

  .add-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 12px 12px;
    color:var(--ink-soft);
    font-size:13.5px;
    cursor:pointer;
  }
  .add-row .plus{
    width:19px;height:19px;
    border-radius:6px;
    border:1.5px dashed var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    color:var(--ink-soft);
  }

  .foot-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:11.5px;
    margin-top:10px;
    padding:0 20px;
    line-height:1.5;
  }

  .status{
    position:fixed;
    bottom:14px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    font-size:12px;
    padding:7px 14px;
    border-radius:20px;
    opacity:0;
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
  }
  .status.show{opacity:.92; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="nav-btn" id="prevBtn">&#8249;</div>
    <div class="week-label">
      <div class="range" id="weekRange">—</div>
      <div class="sub" id="jumpToday">jump to this week</div>
    </div>
    <div class="nav-btn" id="nextBtn">&#8250;</div>
  </div>

  <div class="quote" id="quoteBox">
    <div class="quote-text" id="quoteText"></div>
    <div class="quote-source" id="quoteSource"></div>
  </div>

  <div class="focus">
    <span class="tag">this week —</span>
    <input id="focusInput" type="text" placeholder="what matters most" maxlength="80">
  </div>

  <div id="days"></div>

  <div class="foot-note">Tap a day to add anything — errands, plans, reminders, notes to self. Everything saves automatically on this device, and every week starts fresh.</div>
</div>

<div class="status" id="status">Saved</div>

<script>
(function(){
  const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

  const QUOTES = [
    { text: "Trust in the LORD with all your heart, and do not lean on your own understanding.", source: "Proverbs 3:5" },
    { text: "I can do all things through him who strengthens me.", source: "Philippians 4:13" },
    { text: "Be strong and courageous. Do not fear or be in dread, for the LORD your God is with you wherever you go.", source: "Joshua 1:9" },
    { text: "Cast all your anxieties on him, because he cares for you.", source: "1 Peter 5:7" },
    { text: "This is the day that the LORD has made; let us rejoice and be glad in it.", source: "Psalm 118:24" },
    { text: "For I know the plans I have for you, declares the LORD, plans for welfare and not for evil, to give you a future and a hope.", source: "Jeremiah 29:11" },
    { text: "Come to me, all who labor and are heavy laden, and I will give you rest.", source: "Matthew 11:28" },
    { text: "The LORD is my shepherd; I shall not want.", source: "Psalm 23:1" },
    { text: "Be still, and know that I am God.", source: "Psalm 46:10" },
    { text: "And we know that for those who love God all things work together for good.", source: "Romans 8:28" },
    { text: "Do not be anxious about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God.", source: "Philippians 4:6" },
    { text: "The LORD is my light and my salvation; whom shall I fear?", source: "Psalm 27:1" },
    { text: "Let all that you do be done in love.", source: "1 Corinthians 16:14" },
    { text: "It always seems impossible until it's done.", source: "Nelson Mandela" },
    { text: "The way to get started is to quit talking and begin doing.", source: "Walt Disney" },
    { text: "What lies behind us and what lies before us are tiny matters compared to what lies within us.", source: "Ralph Waldo Emerson" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", source: "Winston Churchill" },
    { text: "The only way to do great work is to love what you do.", source: "Steve Jobs" },
    { text: "In the middle of difficulty lies opportunity.", source: "Albert Einstein" },
    { text: "You are never too old to set another goal or to dream a new dream.", source: "C.S. Lewis" },
    { text: "Do the best you can until you know better. Then when you know better, do better.", source: "Maya Angelou" },
    { text: "The future belongs to those who believe in the beauty of their dreams.", source: "Eleanor Roosevelt" },
    { text: "Small deeds done are better than great deeds planned.", source: "Peter Marshall" },
    { text: "A year from now you may wish you had started today.", source: "Karen Lamb" }
  ];
  function pickQuote(){
    const today = new Date();
    const dayKey = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
    return QUOTES[dayKey % QUOTES.length];
  }

  const daysEl = document.getElementById('days');
  const weekRangeEl = document.getElementById('weekRange');
  const focusInput = document.getElementById('focusInput');
  const statusEl = document.getElementById('status');

  let statusTimer;
  function flash(msg){
    statusEl.textContent = msg || 'Saved';
    statusEl.classList.add('show');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(()=>statusEl.classList.remove('show'), 900);
  }

  function startOfWeek(d){
    const date = new Date(d);
    const day = (date.getDay() + 6) % 7;
    date.setDate(date.getDate() - day);
    date.setHours(0,0,0,0);
    return date;
  }
  function isoDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtRange(monday){
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate()+6);
    const optsSame = { month: 'short' };
    const mMonth = monday.toLocaleDateString(undefined, optsSame);
    const sMonth = sunday.toLocaleDateString(undefined, optsSame);
    if (mMonth === sMonth){
      return `${mMonth} ${monday.getDate()}–${sunday.getDate()}`;
    }
    return `${mMonth} ${monday.getDate()} – ${sMonth} ${sunday.getDate()}`;
  }
  function isSameDay(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  let currentMonday = startOfWeek(new Date());
  let weekData = null;
  let saveTimer = null;

  function emptyWeek(){
    return {
      focus: '',
      days: Array.from({length:7}, () => ({ items: [] }))
    };
  }

  function storageKey(monday){
    return 'planner:week:' + isoDate(monday);
  }

  function loadWeek(monday){
    try{
      const raw = localStorage.getItem(storageKey(monday));
      weekData = raw ? JSON.parse(raw) : emptyWeek();
    }catch(e){
      weekData = emptyWeek();
    }
    render();
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      try{
        localStorage.setItem(storageKey(currentMonday), JSON.stringify(weekData));
        flash('Saved');
      }catch(e){
        flash('Could not save');
      }
    }, 300);
  }

  function render(){
    weekRangeEl.textContent = fmtRange(currentMonday);
    focusInput.value = weekData.focus || '';
    daysEl.innerHTML = '';
    const today = new Date();

    DAY_NAMES.forEach((name, idx) => {
      const date = new Date(currentMonday);
      date.setDate(date.getDate() + idx);
      const dayIsToday = isSameDay(date, today);

      const card = document.createElement('div');
      card.className = 'day' + (dayIsToday ? ' today' : '');

      const head = document.createElement('div');
      head.className = 'day-head';
      head.innerHTML = `
        <div>
          <div class="day-name">${name}</div>
          <div class="day-date">${date.toLocaleDateString(undefined,{month:'short', day:'numeric'})}</div>
        </div>
        ${dayIsToday ? '<div class="today-pill">TODAY</div>' : ''}
      `;
      card.appendChild(head);

      const itemsWrap = document.createElement('div');
      itemsWrap.className = 'items';

      weekData.days[idx].items.forEach((item, itemIdx) => {
        itemsWrap.appendChild(renderItem(idx, itemIdx, item));
      });

      card.appendChild(itemsWrap);

      const addRow = document.createElement('div');
      addRow.className = 'add-row';
      addRow.innerHTML = `<span class="plus">+</span><span>Add item</span>`;
      addRow.addEventListener('click', () => {
        weekData.days[idx].items.push({ text: '', done: false });
        render();
        scheduleSave();
        setTimeout(() => {
          const inputs = daysEl.querySelectorAll(`[data-day="${idx}"] .item-text`);
          const last = inputs[inputs.length - 1];
          if (last) last.focus();
        }, 0);
      });
      card.appendChild(addRow);

      daysEl.appendChild(card);
    });
  }

  function renderItem(dayIdx, itemIdx, item){
    const row = document.createElement('div');
    row.className = 'item' + (item.done ? ' done' : '');
    row.setAttribute('data-day', dayIdx);

    const check = document.createElement('div');
    check.className = 'check' + (item.done ? ' on' : '');
    check.innerHTML = `<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 12L13 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    check.addEventListener('click', () => {
      item.done = !item.done;
      render();
      scheduleSave();
    });

    const text = document.createElement('textarea');
    text.className = 'item-text';
    text.rows = 1;
    text.value = item.text;
    text.placeholder = 'type here';
    text.addEventListener('input', () => {
      item.text = text.value;
      text.style.height = 'auto';
      text.style.height = text.scrollHeight + 'px';
      scheduleSave();
    });
    text.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){ e.preventDefault(); text.blur(); }
    });

    const del = document.createElement('div');
    del.className = 'item-del';
    del.textContent = '×';
    del.addEventListener('click', () => {
      weekData.days[dayIdx].items.splice(itemIdx, 1);
      render();
      scheduleSave();
    });

    row.appendChild(check);
    row.appendChild(text);
    row.appendChild(del);

    setTimeout(() => {
      text.style.height = 'auto';
      text.style.height = text.scrollHeight + 'px';
    }, 0);

    return row;
  }

  focusInput.addEventListener('input', () => {
    weekData.focus = focusInput.value;
    scheduleSave();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    currentMonday = new Date(currentMonday);
    currentMonday.setDate(currentMonday.getDate() - 7);
    loadWeek(currentMonday);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    currentMonday = new Date(currentMonday);
    currentMonday.setDate(currentMonday.getDate() + 7);
    loadWeek(currentMonday);
  });
  document.getElementById('jumpToday').addEventListener('click', () => {
    currentMonday = startOfWeek(new Date());
    loadWeek(currentMonday);
  });

  const quote = pickQuote();
  document.getElementById('quoteText').textContent = '"' + quote.text + '"';
  document.getElementById('quoteSource').textContent = quote.source;

  loadWeek(currentMonday);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>

</body>
</html>
